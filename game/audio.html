<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ONIKS · Audio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #0B0C0A; --lime: #C6F432; --coral: #FF6A3D; --dim: rgba(255,255,255,.62); --faint: rgba(255,255,255,.36); --hair: rgba(255,255,255,.14);
    --sans: 'Geist', 'Segoe UI', sans-serif; --mono: 'Geist Mono', Consolas, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: #fff; font-family: var(--mono); -webkit-font-smoothing: antialiased; }
  body { padding: 34px 40px 60px; min-width: 1280px; }
  .kick { display: flex; gap: 12px; align-items: center; font: 400 12.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--dim); }
  .kick i { width: 7px; height: 7px; background: var(--lime); flex: none; }
  .kick b { color: #fff; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 560px 470px 1fr; gap: 36px; margin-top: 26px; align-items: start; }
  h4 { font: 400 10.5px var(--mono); letter-spacing: .08em; color: var(--faint); margin: 22px 0 9px; text-transform: uppercase; font-weight: 400; }
  h4:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 200px repeat(4, 1fr); gap: 5px; align-items: center; height: 25px; }
  .row .nm { font: 500 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm span { color: var(--faint); }
  button, .chip { font: 500 10.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); background: transparent; border: 1px solid var(--hair);
    padding: 5px 7px 4px; cursor: pointer; user-select: none; white-space: nowrap; }
  button:hover, .chip:hover { color: #fff; border-color: rgba(255,255,255,.34); }
  button:active { border-color: var(--lime); color: var(--lime); }
  .chip.on { color: #fff; border-color: rgba(198,244,50,.6); }
  .chip.on::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--lime); margin-right: 7px; vertical-align: 0; }
  .wrap { display: flex; flex-wrap: wrap; gap: 5px; }
  .ctl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: rgba(255,255,255,.28); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; margin-top: -4px; background: var(--lime); border: 0; }
  canvas { display: block; background: #0B0C0A; border: 1px solid var(--hair); }
  .meter { margin-top: 14px; font: 400 11px/1.75 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); font-variant-numeric: tabular-nums; }
  .meter b { color: #fff; font-weight: 400; }
  .meter .l { color: var(--lime); }
  .meter .c { color: var(--coral); }
  .bar { position: relative; height: 5px; background: rgba(255,255,255,.08); margin: 6px 0 10px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  .bar i.hold { background: none; border-right: 2px solid var(--lime); }
  .res { margin-top: 10px; font: 400 11px/1.75 var(--mono); letter-spacing: .04em; color: var(--dim); white-space: pre; font-variant-numeric: tabular-nums; min-height: 20px; }
  .res b { color: var(--lime); font-weight: 400; }
  .note { font: 400 11.5px/1.5 var(--sans); color: rgba(255,255,255,.42); margin-top: 8px; max-width: 460px; }
  .lock { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #0B0C0A; background: var(--lime); padding: 6px 10px 5px; }
  .lock.off { display: none; }
</style></head>
<body>
<div class="lock" id="lock">Click anywhere to start sound</div>
<div class="kick"><i></i><b>ONIKS</b><span>Audio · audition</span></div>

<div class="grid">
  <div id="left"></div>
  <div>
    <canvas id="top" width="470" height="470"></canvas>
    <div class="meter" id="meter"></div>
    <h4>Tests</h4>
    <div class="wrap"><button id="salvo">Salvo test · 10 s</button><button id="worst">Worst case · point blank</button><button id="measure">Level sweep · 50 m</button></div>
    <div class="wrap" style="margin-top:5px"><button id="replay">Hit replay · x0.25</button><button id="replayJ">Replay again (J) · no event</button><button id="ramp">Rate ramps · spam check</button></div>
    <div class="res" id="res"></div>
    <h4>Thunder after lightning</h4>
    <div class="wrap" id="thunder"></div>
    <div class="res" id="tres"></div>
  </div>
  <div id="right"></div>
</div>

<script type="module">
import { createAudio, db, SPEC } from './src/audio/index.js';

const $ = id => document.getElementById(id);
const DEG = Math.PI / 180, TAU = Math.PI * 2;

/* ---------------- a fake game: camera, sim, map ---------------- */
const cam = { eye: [0, 40, 0], target: [0, 0, 400], f: [0, 0, 1], r: [1, 0, 0], u: [0, 1, 0], followFn: null };
const setCam = h => {
  cam.eye = [0, h, 0];
  const p = Math.min(80, 8 + h / 60) * DEG;       // look a little down; straight down when high
  cam.f = [0, -Math.sin(p), Math.cos(p)]; cam.r = [1, 0, 0]; cam.u = [0, Math.cos(p), Math.sin(p)];
  cam.target = [0, 0, h / Math.tan(p)];
};
let surface = 'coast';
const map = {
  weather: { kind: 'calm', wind: [6, 3], sea: .35 },
  h(x, z) { return surface === 'sea' ? -30 : surface === 'land' ? 20 : (z > 60 ? -20 : 8); },
  water(x, z) { return this.h(x, z) < 0; },
};
const sim = { t: 0, units: new Map(), projectiles: new Map(), weather: { kind: 'calm', wind: [6, 3], sea: .35, squalls: [] } };
const game = { camera: cam, sim, map, side: 'coast', timeRate: 1, paused: false, selection: new Set() };
game.bus = (() => { const L = {}; return { on(n, f) { (L[n] = L[n] || []).push(f); return () => { L[n] = L[n].filter(x => x !== f); }; }, emit(n, d) { for (const f of (L[n] || []).slice()) f(d); } }; })();
setCam(40);

const audio = createAudio(game);
audio.init(game);
window.AUDIO = audio; window.GAME = game;

let nextId = 1000;
const DOM = { tel: 'land', radar: 'land', pantsir: 'land', transloader: 'land', bal: 'land', ddg: 'sea', carrier: 'sea', helo: 'air', fighter: 'air', drone: 'air', aew: 'air', ssk: 'sea', ssn: 'sea' };
/* what the audio reads of a unit's definition: domain, a boat's depths, sonars */
const DEFS = {
  ssk: { domain: 'sea', draught: 6.2, speed: 8.7, sub: { pd: 16, deep: 150, rate: 1.2 }, sensors: { sonar: { sub: 13000, ship: 28000 } } },
  ssn: { domain: 'sea', draught: 9.3, speed: 12.8, sub: { pd: 18, deep: 180, rate: 1.5 }, sensors: { sonar: { sub: 17000, ship: 32000 } } },
  ddg: { domain: 'sea', sensors: { sonar: { sub: 11000, hull: true } } },
  helo: { domain: 'air', sensors: { sonar: { sub: 9000, dip: true } } },
};
function unit(type, pos, o) {
  const u = { id: nextId++, type, side: 'fleet', alive: true, dying: 0, pos: pos.slice(), prev: pos.slice(), hdg: 0, pitch: 0, speed: 0, def: DEFS[type] || { domain: DOM[type] || 'land' }, aboard: false, ...o };
  sim.units.set(u.id, u); return u;
}
/* a boat of that type at a depth (the audio reads depth, dive, mastUp) */
const boatAt = (type, pos, o) => { const u = unit(type, pos, { side: 'coast', depth: 6, dive: 0, mastUp: 1, ...o }); u.pos[1] = -(u.depth - u.def.draught); return u; };
const SPEEDS = { oniks: 750, sm6: 1100, sam: 900, aam: 1200, tlam: 245, hellfire: 400, slam: 240, pdms: 1000, uran: 270, kalibr: 280 };
const SEP = { oniks: 7, sm6: 6, sam: 2.4, aam: 3, tlam: 12, hellfire: 2.5, slam: 3, pdms: 3, uran: 2, kalibr: 5 };
function proj(kind, pos, hdg, o) {
  const p = { id: nextId++, kind, side: 'coast', alive: true, pos: pos.slice(), prev: pos.slice(), vel: [0, 30, 0], t0: sim.t, age: 0, hdg, pitch: Math.PI / 2,
    P: { sepAt: SEP[kind], boost: SEP[kind], speed: SPEEDS[kind] || 600 }, vert: 1.4, life: 30, ...o };
  sim.projectiles.set(p.id, p); return p;
}

/* the world ticks at the sim step so unit.prev -> unit.pos is one DT, like the real sim */
const DT = .05; let acc = 0;
const movers = [];              // fns(dt) for loops (orbiting helo etc.)
function stepWorld(dt) {
  for (const u of sim.units.values()) u.prev = u.pos.slice();
  for (const p of sim.projectiles.values()) {
    p.prev = p.pos.slice(); p.age += dt;
    if (p.fly) { p.fly(p, dt); continue; }
    const spd = p.age < p.P.boost ? 30 + (p.P.speed - 30) * Math.min(1, p.age / p.P.boost) : p.P.speed;
    if (p.age > p.vert) p.pitch = Math.max(.02, p.pitch - dt * .45);
    p.vel = [spd * Math.sin(p.hdg) * Math.cos(p.pitch), spd * Math.sin(p.pitch), spd * Math.cos(p.hdg) * Math.cos(p.pitch)];
    for (let k = 0; k < 3; k++) p.pos[k] += p.vel[k] * dt;
    if (p.age >= p.P.sepAt && !p.sepDone) { p.sepDone = true; audio.onEvent({ type: 'booster_sep', t: sim.t, proj: p.id, kind: p.kind, pos: p.pos.slice() }); }
    if (p.age > p.life) { p.alive = false; }
  }
  for (const [id, p] of sim.projectiles) if (!p.alive) sim.projectiles.delete(id);
  for (const m of movers) m(dt);
  sim.t += dt;
}

/* ---------------- positions ---------------- */
const at = (d, brg, y) => [Math.sin(brg * DEG) * d, y === undefined ? 2 : y, Math.cos(brg * DEG) * d];
const air = (d, brg) => at(d, brg, Math.min(d * .35, 3000) + 40);
const ev = (o) => audio.onEvent({ t: sim.t, ...o });

/* ---------------- event rows: 50 m, 1 km, 10 km, 30 km ---------------- */
const DISTS = [[50, '50 m'], [1000, '1 km'], [10000, '10 km'], [30000, '30 km']];
const EVENTS = [
  ['Launches', null],
  ['launch · 3M55 <span>TEL cold</span>', d => { const pos = at(d, 20, 6); const p = proj('oniks', pos, 20 * DEG); ev({ type: 'launch', kind: 'oniks', proj: p.id, pos, side: 'coast' }); }],
  ['launch · SM-6 <span>VLS</span>', d => { const pos = at(d, 20, 9); const p = proj('sm6', pos, 200 * DEG, { vert: 2 }); ev({ type: 'launch', kind: 'sm6', proj: p.id, pos, side: 'fleet' }); }],
  ['launch · 57E6 <span>Pantsir</span>', d => { const pos = at(d, 20, 4); const p = proj('sam', pos, 20 * DEG, { vert: 0, pitch: .5 }); ev({ type: 'launch', kind: 'sam', proj: p.id, pos, side: 'coast' }); }],
  ['launch · AIM-120 <span>rail</span>', d => { const pos = air(d, 20); const p = proj('aam', pos, 20 * DEG, { vert: 0, pitch: 0 }); ev({ type: 'launch', kind: 'aam', proj: p.id, pos, side: 'fleet' }); }],
  ['launch · Kh-35U <span>Bal</span>', d => { const pos = at(d, 20, 5); const p = proj('uran', pos, 200 * DEG, { vert: 0, pitch: .12 }); ev({ type: 'launch', kind: 'uran', proj: p.id, pos, side: 'coast' }); }],
  ['launch · Kalibr <span>Kilo</span>', d => { const b = boatAt('ssk', at(d, 20, 0), { depth: 16, dive: 1 }); const pos = at(d, 20, .5); const p = proj('kalibr', pos, 20 * DEG, { vert: 1.6 }); ev({ type: 'launch', kind: 'kalibr', proj: p.id, from: b.id, pos, side: 'coast' }); setTimeout(() => sim.units.delete(b.id), 20000); }],
  ['launch · Tomahawk <span>Virginia</span>', d => { const b = boatAt('ssn', at(d, 20, 0), { depth: 18, dive: 1, side: 'fleet' }); const pos = at(d, 20, .5); const p = proj('tlam', pos, 20 * DEG, { vert: 2 }); ev({ type: 'launch', kind: 'tlam', proj: p.id, from: b.id, pos, side: 'fleet' }); setTimeout(() => sim.units.delete(b.id), 20000); }],
  ['booster sep', d => ev({ type: 'booster_sep', pos: air(d, 20), kind: 'oniks', proj: -1 })],
  ['Guns', null],
  ['gunfire · 5"/62', d => ev({ type: 'launch', kind: 'shell', pos: at(d, 20, 12), proj: -2 })],
  ['gunfire · 30 mm <span>1 s</span>', d => ev({ type: 'gunfire', weapon: 'gun30', dur: 1, pos: at(d, 20, 4) })],
  ['gunfire · Phalanx <span>1 s</span>', d => ev({ type: 'gunfire', weapon: 'ciws', dur: 1, pos: at(d, 20, 16) })],
  ['Intercepts, hits', null],
  ['intercept · SM-6', d => ev({ type: 'intercept', pos: air(d, 20), kind: 'oniks', byKind: 'sm6' })],
  ['intercept · gun kill', d => ev({ type: 'intercept', pos: air(d, 20), kind: 'oniks', byKind: 'ciws' })],
  ['hit · 3M55 on a ship', d => { const u = unit('ddg', at(d, 20, 0)); ev({ type: 'hit', pos: at(d, 20, 6), kind: 'oniks', target: u.id }); sim.units.delete(u.id); }],
  ['hit · Hellfire on a TEL', d => ev({ type: 'hit', pos: at(d, 20, 2), kind: 'hellfire', target: -1 })],
  ['hit · 30 mm on a drone', d => ev({ type: 'hit', pos: air(d, 20), kind: 'gun30', target: -1 })],
  ['splash · miss at sea', d => ev({ type: 'splash', pos: at(d, 20, 0), kind: 'oniks', water: true })],
  ['splash · self-destruct', d => ev({ type: 'splash', pos: air(d, 20), kind: 'sm6', air: true })],
  ['destroyed · DDG', d => ev({ type: 'destroyed', pos: at(d, 20, 0), unit: -1, unitType: 'ddg', side: 'fleet' })],
  ['destroyed · TEL', d => ev({ type: 'destroyed', pos: at(d, 20, 2), unit: -1, unitType: 'tel', side: 'fleet' })],
  ['destroyed · F/A-18E', d => ev({ type: 'destroyed', pos: air(d, 20), unit: -1, unitType: 'fighter', side: 'fleet' })],
  ['Sonar, torpedoes, boats', null],
  ['sonar ping · hull <span>SQS-53C</span>', d => audio.play('sonar_ping', at(d, 20, 0), { delay: false })],
  ['sonar ping · echo <span>3 km</span>', d => audio.play('sonar_ping', at(d, 20, 0), { delay: false, echo: 4, eg: .8 })],
  ['sonar ping · dipping <span>AQS-22</span>', d => audio.play('sonar_ping', at(d, 20, 0), { delay: false, dip: true, echo: 2.2, eg: .9 })],
  ['sonar · heard <span>tick</span>', d => ev({ type: 'sonar', side: 'coast', by: -5, unit: -6, pos: at(d, 20, 0), r: 600 })],
  ['torpedo · boat bow tube', d => { const b = boatAt('ssk', at(d, 20, 0), { depth: 40, dive: 2 }); const pos = [b.pos[0], -20, b.pos[2]]; ev({ type: 'launch', kind: 't53', proj: nextId++, from: b.id, pos, side: 'coast' }); setTimeout(() => sim.units.delete(b.id), 8000); }],
  ['torpedo · Mk 32 deck', d => { const s = unit('ddg', at(d, 20, 0)); ev({ type: 'launch', kind: 'mk54', proj: nextId++, from: s.id, pos: at(d, 20, 3), side: 'fleet' }); setTimeout(() => sim.units.delete(s.id), 4000); }],
  ['torpedo · helo drop', d => { const h = unit('helo', at(d, 20, 40)); ev({ type: 'launch', kind: 'mk54', proj: nextId++, from: h.id, pos: at(d, 20, 38), side: 'fleet' }); setTimeout(() => sim.units.delete(h.id), 4000); }],
  ['hit · torpedo under a DDG', d => { const u = unit('ddg', at(d, 20, 0)); ev({ type: 'hit', pos: at(d, 20, .5), kind: 'mk48', target: u.id, under: true }); sim.units.delete(u.id); }],
  ['boat · vents <span>dive</span>', d => audio.play('sub_dive', at(d, 20, 0))],
  ['boat · blow <span>to the surface</span>', d => audio.play('sub_blow', at(d, 20, -12))],
  ['boat · breaks surface', d => audio.play('sub_surface', at(d, 20, 0))],
  ['Weather, scan', null],
  ['lightning <span>thunder</span>', d => ev({ type: 'lightning', pos: at(d, -30, 0), top: [...at(d, -30, 3500)] })],
  ['lightning · in cloud <span>rumble</span>', d => ev({ type: 'lightning_ic', pos: at(Math.max(d, 1500), -30, 4200), r: 5000, seed: d | 0, s: .85 })],
  ['scan · enemy', d => ev({ type: 'scan', phase: 'hit', side: 'fleet', pos: at(d, 20, 2), hits: [] })],
  ['Machinery', null],
  ['deploy · jacks down', d => ev({ type: 'deploy', what: 'jacks', pos: at(d, 20, 2) })],
  ['deploy · erect', d => ev({ type: 'deploy', what: 'erect', pos: at(d, 20, 2) })],
  ['deploy · lowered', d => ev({ type: 'deploy', what: 'lowered', pos: at(d, 20, 2) })],
  ['deploy · mast up', d => ev({ type: 'deploy', what: 'mast_up', pos: at(d, 20, 2) })],
  ['reload start', d => ev({ type: 'reload_start', pos: at(d, 20, 2), side: 'coast' })],
  ['reload done', d => ev({ type: 'reload_done', pos: at(d, 20, 2), side: 'coast' })],
  ['radar on', d => ev({ type: 'radar', on: true, pos: at(d, 20, 6), side: 'coast' })],
  ['takeoff · F/A-18E', d => ev({ type: 'takeoff', pos: at(d, 20, 18), unit: -1, unitType: 'fighter' })],
  ['takeoff · Orlan-10', d => ev({ type: 'takeoff', pos: at(d, 20, 4), unit: -1, unitType: 'drone' })],
  ['takeoff · E-2D', d => ev({ type: 'takeoff', pos: at(d, 20, 18), unit: -1, unitType: 'aew' })],
];
{
  const L = $('left');
  for (const [name, fn] of EVENTS) {
    if (!fn) { const h = document.createElement('h4'); h.textContent = name; L.appendChild(h); continue; }
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<div class="nm">${name}</div>`;
    for (const [d, lab] of DISTS) { const b = document.createElement('button'); b.textContent = lab; b.onclick = () => fn(d); r.appendChild(b); }
    L.appendChild(r);
  }
}

/* ---------------- right column: controls, interface sounds, loops ---------------- */
const R = $('right');
R.innerHTML = `
  <h4>Time</h4><div class="wrap" id="rates"></div>
  <h4>Camera</h4>
  <div class="ctl"><span>Height</span><input type="range" id="h" min="0" max="1000" value="${Math.round(Math.log10(40 / 5) / Math.log10(50000 / 5) * 1000)}">
  <span>Surface</span><div class="wrap" id="surf"></div>
  <span>Weather</span><div class="wrap" id="wx"></div>
  <span>Page trim</span><input type="range" id="trim" min="0" max="100" value="100"></div>
  <div class="note" id="camnote"></div>
  <h4>Interface and sensors</h4><div class="wrap" id="ui"></div>
  <h4>Scan · own</h4><div class="wrap" id="scan"></div>
  <h4>Loops</h4><div class="wrap" id="loops"></div>
  <div class="note">Loops are fake units the audio finds in <code>sim.units</code> / <code>sim.projectiles</code>, like the game's. The flybys pass 30 m to the right of the camera; the supersonic one is silent until its Mach cone sweeps the camera.</div>`;

function chips(el, list, get, set) {
  const draw = () => { for (const c of el.children) c.classList.toggle('on', c.dataset.v === String(get())); };
  for (const [v, lab] of list) { const c = document.createElement('span'); c.className = 'chip'; c.dataset.v = String(v); c.textContent = lab; c.onclick = () => { set(v); draw(); }; el.appendChild(c); }
  draw(); return draw;
}
const drawRates = chips($('rates'), [[0, 'Pause'], [1, 'x1'], [2, 'x2'], [4, 'x4'], [8, 'x8'], [16, 'x16'], [32, 'x32']],
  () => game.paused ? 0 : game.timeRate, v => {
    if (v === 0) game.paused = !game.paused; else { game.paused = false; game.timeRate = v; }
    game.bus.emit('rate', { rate: game.timeRate, paused: game.paused, why: 'user' });
  });
chips($('surf'), [['sea', 'Open sea'], ['coast', 'Coast'], ['land', 'Inland']], () => surface, v => surface = v);
chips($('wx'), [['calm', 'Calm'], ['haze', 'Haze'], ['rain', 'Rain'], ['storm', 'Storm']], () => sim.weather.kind, v => {
  sim.weather.kind = map.weather.kind = v;
  sim.weather.squalls = v === 'rain' || v === 'storm' ? [{ x: 0, z: 0, r: 6000 }] : [];
  sim.weather.wind = v === 'storm' ? [14, 6] : v === 'rain' ? [9, 4] : [5, 2];
});
const hOf = () => 5 * Math.pow(50000 / 5, +$('h').value / 1000);
$('h').oninput = () => setCam(hOf());
$('trim').oninput = () => audio.core.trim(+$('trim').value / 100);

for (const n of ['select', 'order', 'invalid', 'pause', 'resume', 'alert', 'alarm', 'contact', 'contact_esm', 'classify', 'lost', 'sweep', 'confirm',
  'objective', 'objective_lost', 'reinforce', 'radar_on', 'radar_off', 'damage', 'move', 'tick', 'enter', 'back', 'deny', 'sonar_contact', 'replay_in', 'replay_boom']) {
  const b = document.createElement('button'); b.textContent = n.replace('_', ' '); b.onclick = () => audio.ui(n, { pos: at(2000, 60, 0) }); $('ui').appendChild(b);
}
{ const b = document.createElement('button'); b.textContent = 'rate x8 up'; b.onclick = () => audio.ui('rate', { rate: 8, up: true }); $('ui').appendChild(b); }
{ const b = document.createElement('button'); b.textContent = 'rate drop to x1'; b.onclick = () => audio.ui('rate', { rate: 1, up: false }); $('ui').appendChild(b); }
for (const [d, lab] of [[300, 'Scan 300 m'], [4000, 'Scan 4 km'], [25000, 'Scan 25 km']]) {
  const b = document.createElement('button'); b.textContent = lab;
  b.onclick = () => {
    const pos = at(d, -15, 2);
    ev({ type: 'scan', phase: 'start', side: 'coast', pos, from: [0, 0, 0], delay: 1.6 });
    const t0 = sim.t;

/* the hit replay as replay.js drives it: time eases to x0.25 (bus 'rate' why 'replay'), bus 'replay' on, the impact
   (a hit event on the watched hull, or for J only the state's tHit), then out and back to x1 */
function fakeReplay(withEvent) {
  if (!audio.ready) { res.textContent = 'Click once to start sound first'; return; }
  game.timeRate = 1; game.paused = false; drawRates(); setCam(40);
  audio.core.resetMeter();
  const ship = unit('ddg', at(320, 25, 0));
  const S = { id: ship.id, t: 0, tHit: -1, phase: 'in' }, t0 = performance.now();
  game.replay = { get active() { return S.phase === 'in'; }, get state() { return S.phase === 'done' ? null : S; } };
  game.bus.emit('rate', { rate: .25, paused: false, why: 'replay' }); game.bus.emit('replay', { on: true, id: ship.id });
  const p = proj('oniks', at(3000, 25, 15), 205 * DEG, { fly: (q, dt) => { const d = [ship.pos[0] - q.pos[0], 6 - q.pos[1], ship.pos[2] - q.pos[2]], l = Math.hypot(...d) || 1; q.vel = d.map(x => x / l * 750); for (let k = 0; k < 3; k++) q.pos[k] += q.vel[k] * dt; if (l < 20) q.alive = false; } });
  p.t0 = sim.t - 30; p.sepDone = true;
  test = { name: withEvent ? 'replay' : 'replay J', t0, peak: 0, pre: 0, gr: 0, voices: 0, nodes: 0, pending: 0, loops: 0, n: 0, dur: 11, plan: [], i: 0 };
  const iv = setInterval(() => {
    const t = (performance.now() - t0) / 1000;
    S.t = t;
    if (S.phase === 'in') game.timeRate = Math.max(.25, 1 - (1 - .25) * Math.min(1, t / .35));
    if (S.tHit < 0 && t >= 1.7) {
      S.tHit = t;
      if (withEvent) ev({ type: 'hit', pos: at(320, 25, 6), kind: 'oniks', target: ship.id });
      sim.projectiles.delete(p.id);
    }
    if (S.phase === 'in' && t >= 7) { S.phase = 'out'; S.tOut = t; game.bus.emit('replay', { on: false, id: ship.id }); }
    if (S.phase === 'out') { const k = Math.min(1, (t - S.tOut) / .55); game.timeRate = .25 + (1 - .25) * k; if (k >= 1) { S.phase = 'done'; game.timeRate = 1; game.bus.emit('rate', { rate: 1, paused: false, why: 'replay' }); clearInterval(iv); sim.units.delete(ship.id); } }
  }, 16);
  res.textContent = 'Running';
}

/* rate ramps (the film maker, the debrief, the replay's eases): game.timeRate swept through fractions for 4 s with no
   'user' bus events, then three player steps; counts the rate / pause blips made */
$('ramp').onclick = () => {
  if (!audio.ready) { res.textContent = 'Click once to start sound first'; return; }
  const counts = {}, V = audio.core.voice.bind(audio.core);
  audio.core.voice = (cls, prio, sp, name) => { const v = V(cls, prio, sp, name); if (v) counts[name] = (counts[name] || 0) + 1; return v; };
  const t0 = performance.now();
  const iv = setInterval(() => {
    const t = (performance.now() - t0) / 1000;
    if (t < 4) game.timeRate = t < 1 ? 1 - .75 * t : t < 2.5 ? .25 + 7.75 * (t - 1) / 1.5 : 8 - 7 * (t - 2.5) / 1.5;
    else if (t < 4.1) { game.timeRate = 1; game.bus.emit('rate', { rate: 1, paused: false, why: 'film' }); }
    else if (!counts._steps) {
      counts._steps = 1;
      const step = (r, d) => setTimeout(() => { game.timeRate = r; game.bus.emit('rate', { rate: r, paused: false, why: 'user' }); }, d);
      step(2, 0); step(4, 400); step(1, 800);
      setTimeout(() => { game.timeRate = 1; game.bus.emit('rate', { rate: 1, paused: false, why: 'auto' }); }, 1000);
    }
    if (t > 5.6) {
      clearInterval(iv); audio.core.voice = V; drawRates();
      const r = { rampBlips: 0, stepBlips: 0 }; r.stepBlips = counts.rate || 0;
      window.RAMP = { counts, expected: '3 player steps -> 3 rate blips, 0 during the ramps (the auto drop is a no-op at x1)' };
      console.log('RAMP', JSON.stringify(window.RAMP));
      res.textContent = `rate ramps: ${counts.rate || 0} rate blips (3 expected: the player's steps only)`;
    }
  }, 16);
};
function runPlan() {
  if (!test || !test.plan) return;
  const t = (performance.now() - test.t0) / 1000;
  if (test.name.startsWith('replay') && t > 7.6) delete game.replay;
  while (test.i < test.plan.length && test.plan[test.i][0] <= t) test.plan[test.i++][1]();
  if (t > (test.dur || 16)) {             // the events + their tails
    const r = { events: test.n, peakOutDb: +db(test.peak).toFixed(2), preLimiterPeakDb: +db(test.pre).toFixed(2), maxLimiterReductionDb: +test.gr.toFixed(2),
      maxVoices: test.voices, maxLoops: test.loops, maxNodes: test.nodes, maxPending: test.pending, clipped: test.peak >= .999 };
    console.log(test.name.toUpperCase(), JSON.stringify(r));
    if (test.name === 'worst') window.WORST = r;
    if (test.name.startsWith('replay')) window.REPLAY = r;
    res.innerHTML = `${test.name === 'worst' ? 'worst case' : test.name}\nevents        <b>${r.events}</b>\npeak out      <b>${r.peakOutDb} dBFS</b>   ${r.clipped ? 'CLIPPED' : 'no clip'}\npre-chain     ${r.preLimiterPeakDb} dBFS\nlimiter       ${r.maxLimiterReductionDb} dB max reduction\nvoices        ${r.maxVoices} max · loops ${r.maxLoops}\nnodes         ${r.maxNodes} max · fronts ${r.maxPending}`;
    if (test.name === 'salvo') window.SALVO = r;
    test = null;
  }
}

const cv = $('top'), cx = cv.getContext('2d'), CW = cv.width, C0 = CW / 2, RMAX = CW / 2 - 16;
const rad = d => RMAX * Math.log10(1 + d / 50) / Math.log10(1 + 32000 / 50);
const toXY = p => { const d = Math.hypot(p[0] - cam.eye[0], p[2] - cam.eye[2]), a = Math.atan2(p[0] - cam.eye[0], p[2] - cam.eye[2]), r = rad(d); return [C0 + Math.sin(a) * r, C0 - Math.cos(a) * r]; };
function dotted(r, col, a, step) {
  const n = Math.max(24, Math.floor(TAU * r / (step || 5)));
  cx.fillStyle = col; cx.globalAlpha = a;
  for (let i = 0; i < n; i++) { const t = i / n * TAU; cx.fillRect(C0 + Math.sin(t) * r - .75, C0 - Math.cos(t) * r - .75, 1.5, 1.5); }
  cx.globalAlpha = 1;
}
function draw() {
  cx.fillStyle = '#0B0C0A'; cx.fillRect(0, 0, CW, CW);
  if (flash > 0) { cx.fillStyle = `rgba(255,255,255,${flash * .5})`; cx.fillRect(0, 0, CW, CW); flash = Math.max(0, flash - .06); }
  cx.font = '500 9.5px "Geist Mono", monospace'; cx.textBaseline = 'middle';
  for (const [d, lab] of [[100, '100 M'], [1000, '1 KM'], [10000, '10 KM'], [30000, '30 KM']]) {
    const r = rad(d); dotted(r, '#fff', .22, 6);
    cx.fillStyle = 'rgba(255,255,255,.36)'; cx.fillText(lab, C0 + r * .707 + 4, C0 + r * .707 + 4);   // labels down the south-east diagonal
  }
  // sources
  for (const u of sim.units.values()) { const [x, y] = toXY(u.pos); cx.fillStyle = u.alive ? '#fff' : '#FF6A3D'; cx.fillRect(x - 2, y - 2, 4, 4); }
  for (const p of sim.projectiles.values()) { const [x, y] = toXY(p.pos); cx.fillStyle = '#fff'; cx.fillRect(x - 1.5, y - 1.5, 3, 3); }
  // fronts: each travelling sound, its source, and how far its front has come toward the camera
  const labelled = [];
  for (const f of audio.fronts()) {
    const [sx, sy] = toXY(f.pos), k = Math.min(1, f.r / Math.max(1, f.d));
    const fp = [f.pos[0] + (cam.eye[0] - f.pos[0]) * k, 0, f.pos[2] + (cam.eye[2] - f.pos[2]) * k], [fx, fy] = toXY(fp);
    cx.strokeStyle = 'rgba(198,244,50,.28)'; cx.setLineDash([2, 4]); cx.beginPath(); cx.moveTo(sx, sy); cx.lineTo(C0, C0); cx.stroke(); cx.setLineDash([]);
    cx.strokeStyle = '#C6F432'; cx.beginPath(); cx.moveTo(sx, sy); cx.lineTo(fx, fy); cx.stroke();
    cx.fillStyle = '#C6F432'; cx.fillRect(sx - 2.5, sy - 2.5, 5, 5); cx.fillRect(fx - 1.5, fy - 1.5, 3, 3);
    if (!labelled.some(([x, y]) => Math.abs(x - sx) < 70 && Math.abs(y - sy) < 12)) {     // one label per spot
      labelled.push([sx, sy]); cx.fillStyle = 'rgba(198,244,50,.8)'; cx.fillText(f.name.toUpperCase(), sx + 6, sy);
    }
  }
  // the camera
  cx.fillStyle = '#C6F432'; cx.fillRect(C0 - 4, C0 - 4, 8, 8);
  cx.strokeStyle = 'rgba(198,244,50,.5)'; cx.beginPath(); cx.moveTo(C0, C0); cx.lineTo(C0, C0 - 22); cx.stroke();
  cx.fillStyle = 'rgba(255,255,255,.36)'; cx.fillText('N', C0 - 3, 10);
}

/* ---------------- meters ---------------- */
let hold = 0, holdT = 0, logT = 0;
function meters() {
  const s = audio.stats(), m = audio.core.now;
  if (audio.ready) $('lock').classList.add('off');
  if (m.out >= hold || performance.now() - holdT > 1500) { hold = m.out; holdT = performance.now(); }
  const w = x => Math.max(0, Math.min(100, (db(x) + 60) / 60 * 100));
  let t = '';
  if (tdemo) {
    const el = (performance.now() - tdemo.real0) / 1000, pendingT = audio.fronts().some(f => f.name === 'thunder');
    const due = tdemo.d / 343 / (game.paused ? 1 : game.timeRate);
    if (!pendingT && tdemo.arr === undefined) tdemo.arr = el;
    const note = due > 12 ? ' · waits past 12 s are shortened' : '';
    $('tres').innerHTML = pendingT ? `flash at ${tdemo.lab} · channel ${Math.round(tdemo.d)} m · sound needs <b>${due.toFixed(1)} s</b> · ${el.toFixed(1)} s so far${note}` : `thunder arrived after <b>${tdemo.arr.toFixed(1)} s</b> (${Math.round(tdemo.d)} m / 343 m/s / x${game.timeRate} = ${due.toFixed(1)} s${note})`;
  }
  $('meter').innerHTML = `<div class="bar"><i style="width:${w(m.out)}%"></i><i class="hold" style="width:${w(hold)}%"></i></div>`
    + `out <b>${db(m.out).toFixed(1)}</b> dBFS · hold <b>${db(hold).toFixed(1)}</b> · limiter <b class="${m.gr > .5 ? 'l' : ''}">${(-m.gr).toFixed(1)}</b> dB<br>`
    + `voices <b>${s.voices}</b> (${s.world} world · ${s.sig} sig · ${s.ui} ui) · loops <b>${s.loops}</b> · fronts <b>${s.pending}</b> · nodes <b>${s.nodes}</b><br>`
    + `context <b class="${s.state === 'running' ? 'l' : 'c'}">${s.state}</b> · x${game.timeRate}${game.paused ? ' paused' : ''} · camera <b>${Math.round(s.h || cam.eye[1])} m</b> · sea ${(s.sea * 100).toFixed(0)}%`;
  $('camnote').textContent = `Eye ${Math.round(cam.eye[1])} m over ${surface}; sea wash fades by 1.5 km, wind thins and whistles with height.`;
  if (performance.now() - logT > 2000 && (test || s.voices > 0)) { logT = performance.now(); console.log('audio', JSON.stringify(s)); }
}

/* ---------------- loop ---------------- */
let last = performance.now(), lastRaf = 0;
function tick(ts) {
  const dt = Math.min(.1, (ts - last) / 1000); last = ts;
  const dtSim = game.paused ? 0 : dt * game.timeRate;
  acc += dtSim;
  let n = 0;
  while (acc >= DT && n++ < 200) { stepWorld(DT); acc -= DT; }
  audio.update(dt, dtSim);
  audio.core.measure();
  track(); runPlan(); draw(); meters();
}
function frame(ts) { lastRaf = performance.now(); tick(performance.now()); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
// a page in a background tab gets no animation frames: keep the loop (and the meters) going on a timer
setInterval(() => { if (performance.now() - lastRaf > 100) tick(performance.now()); }, 16);
addEventListener('pointerdown', () => $('lock').classList.add('off'), { once: true });
</script>
</body></html>
