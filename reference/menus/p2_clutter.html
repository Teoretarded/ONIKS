function render(t) {

    if (zc < 1) continue;
    const sx = cx + F * (dx * r0x + dy * r1x + dz * r2x) / zc, sy = cy - F * (dx * u0 + dy * u1 + dz * u2) / zc;

      if (q) pb.dot(q[0], q[1], 1, LIME[0], LIME[1], LIME[2], ba * .55 * (1 - j / 7) * (1 - .5 * r / RMAX));
    }
