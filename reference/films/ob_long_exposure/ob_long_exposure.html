<!doctype html>
<html><head><meta charset="utf-8"><title>Oniks — Long Exposure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=DM+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="../menus/common/orbital.css">
<style>
  .word { left: 92px; top: 58px; font: 300 66px var(--sans); letter-spacing: -.045em; line-height: 1; }
  .fig { left: 96px; top: 140px; width: 900px; }
  .fig .n2 { display: block; margin-top: 7px; font: 400 11.5px var(--mono); letter-spacing: 0; color: var(--w3); }
  .menu { left: 50%; bottom: 92px; transform: translateX(-50%); display: flex; }
  .menu .it { display: flex; align-items: baseline; gap: 10px; padding: 0 30px; height: 44px; font-size: 25px; letter-spacing: -.02em; border-left: 1px solid var(--wr); }
  .menu .it:first-child { border-left: 0; }
  .menu .it .n { font-size: 11.5px; }
  .menu .it .go { display: none; }
  .menu .it .bar { left: 30px; right: 30px; bottom: -4px; }
  .blurb { left: 50%; bottom: 150px; transform: translateX(-50%); text-align: center; width: 760px; font-size: 14.5px; }
  .keys { left: 92px; bottom: 40px; font-size: 12.5px; gap: 18px; }
  .foot { right: 92px; bottom: 42px; }
  .clk { right: 92px; top: 54px; text-align: right; }
  .clk .t { font: 300 40px var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .clk .l { margin-top: 10px; font: 400 12.5px var(--mono); color: var(--w3); line-height: 1.9; font-variant-numeric: tabular-nums; }
  .clk .l b { font-weight: 400; color: var(--w); }
  .clk .l .y { color: var(--hi); }
  .call { opacity: 0; }
  .call .cat .t { font-variant-numeric: tabular-nums; }
  .hl { position: relative; display: inline-block; color: var(--ink); padding: 0 1px; }
  .hl .sw { position: absolute; left: -.35em; top: -.2em; width: calc(100% + .7em); height: calc(100% + .4em); fill: var(--hi); overflow: visible; }
  .hl .tx { position: relative; }
</style></head>
<body><div id="stage">
  <canvas id="c"></canvas>
  <div class="ui" id="ui">
    <div class="word abs">Oniks</div>
    <div class="fig abs" id="fig"></div>
    <div class="clk abs"><div class="t" id="clkT">T−00:18.00</div><div class="l" id="clkL"></div></div>
    <div class="menu abs" id="menu"></div>
    <div class="blurb abs" id="blurb"></div>
    <div class="keys abs"><span><b>←→</b>Select</span><span><b>Enter</b>Open</span><span><b>G</b>Graphics</span><span><b>Esc</b>Quit</span></div>
    <div class="foot abs">Proto v0.5.0</div>
  </div>
  <div class="veil" id="veil"><div class="msg">Stand the battery down.</div></div>
</div>
