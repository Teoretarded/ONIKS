<style>
  .logo { left: 72px; top: 58px; }
  .kick { left: 74px; top: 98px; }
  .ro { left: 74px; top: 132px; font: 400 11.5px/1.9 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ro b { font-weight: 400; color: #fff; }
  .ro .l { color: var(--lime); }
  .menu { left: 0; right: 0; bottom: 150px; display: flex; justify-content: center; gap: 54px; }
  .menu .it { font-size: 31px; font-weight: 500; letter-spacing: -.03em; gap: 12px; }
  .menu .it .n { width: auto; }
  .blurb { left: 0; right: 0; bottom: 100px; text-align: center; font-size: 15px; }
  .keys { left: 50%; bottom: 44px; transform: translateX(-50%); }
  .foot { right: 72px; top: 62px; }
  .inset { position: absolute; right: 72px; top: 110px; width: 480px; height: 270px; outline: 1px solid rgba(255,255,255,.28); }
  .inset .l { position: absolute; left: 0; top: -24px; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); display: flex; gap: 10px; white-space: nowrap; }
  .inset .l i { font-style: normal; color: var(--lime); }
  .tag.sm { font-size: 10.5px; }
  .tag.sm b, .tag.sm i, .tag.sm .v { padding: 4px 6px 3px; }
  .tag.ghost b { background: transparent; color: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,.42); }
  .tag.ghost i { color: rgba(255,255,255,.72); }
  .tag .v { font-variant-numeric: tabular-nums; }
  .tag.coral b { background: var(--coral); }
  .tag.coral .v { color: var(--coral); }
  .bars { position: absolute; left: 0; top: 0; display: grid; grid-template-columns: auto 64px 34px; column-gap: 9px; row-gap: 6px; align-items: center; padding: 8px 10px 8px 9px; background: rgba(11,12,10,.72);
    font: 500 10.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); will-change: transform; }
  .bars .b { height: 4px; background: rgba(255,255,255,.12); position: relative; }
  .bars .b i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.75); }
  .bars .v { text-align: right; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; }
  .bars .top { color: #fff; }
  .bars .top.b i { background: var(--lime); }
  .bars .top.v { color: var(--lime); }
